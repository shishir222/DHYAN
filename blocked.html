<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked — DHYAN</title>
  <link rel="stylesheet" href="blocked.css">
</head>

<body>
  <div class="blocked-container">
    <div class="lock-icon">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
    </div>

    <h1>Get Back To Work!</h1>
    <p class="subtitle">You added this site to your blacklist for a reason. Stop slacking off and get back to your focus session!</p>

   <div class="creative-message">
      <p>"The future depends on what you do today." — Mahatma Gandhi</p>
    </div>

    <p class="footer-note">DHYAN — Stay in the zone.</p>
  </div>

  <script>
    // Read timer from extension storage
    if (chrome && chrome.storage) {
      chrome.storage.local.get(null, (data) => {
        if (data.endTime) {
          const timerEl = document.getElementById('blocked-timer');
          function updateTimer() {
            const diff = data.endTime - Date.now();
            if (diff <= 0) {
              timerEl.textContent = '00:00';
              return;
            }
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
          }
          updateTimer();
          setInterval(updateTimer, 1000);
        }
      });
    }
  </script>
</body>

</html>
